<!doctype html>
<!--
  wordpress.org banner for GAinWP. Rendered at 772x250 (scale 1) and
  1544x500 (scale 2) by assets-src/render.mjs into .wordpress-org/.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>GAinWP banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=block">
<style>
	:root {
		--orange: #f8981e;
		--red: #ef5930;
		--blue: #117abb;
		--green: #1e8a4c;
		--ink: #1d2327;
	}
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 772px; height: 250px; overflow: hidden; }
	body {
		position: relative;
		font-family: Montserrat, system-ui, sans-serif;
		background: var(--orange);
		color: #fff;
	}
	/* Angled red field, echoing the previous banner and the icon's bars. */
	.field {
		position: absolute;
		inset: 0;
		background: linear-gradient(105deg, transparent 0 59%, var(--red) 59% 100%);
	}
	.copy {
		position: absolute;
		left: 34px;
		top: 34px;
		width: 420px;
	}
	.brand { display: flex; align-items: center; gap: 12px; }
	.brand img { width: 46px; height: 46px; border-radius: 50%; }
	.brand span { font-weight: 800; font-size: 28px; letter-spacing: -.3px; }
	h1 {
		margin-top: 14px;
		font-weight: 700;
		font-size: 21px;
		line-height: 1.25;
		letter-spacing: -.2px;
	}
	.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
	.tags span {
		font-weight: 600;
		font-size: 11px;
		padding: 4px 9px;
		border-radius: 999px;
		background: rgba(255, 255, 255, .22);
		border: 1px solid rgba(255, 255, 255, .55);
	}
	/* Mock of a form row in the settings screen and the event it sends. */
	.card {
		position: absolute;
		right: 36px;
		top: 50%;
		transform: translateY(-50%);
		width: 268px;
		padding: 18px 18px 16px;
		background: #fff;
		color: var(--ink);
		border-radius: 10px;
		box-shadow: 0 12px 28px rgba(80, 20, 0, .28);
		font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	.card label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 7px; }
	.card label small { font-weight: 400; color: #646970; margin-left: 4px; }
	.card .row { display: flex; gap: 8px; }
	.card .select,
	.card .money {
		font-size: 13px;
		padding: 7px 10px;
		border: 1.5px solid #8c8f94;
		border-radius: 5px;
		white-space: nowrap;
	}
	.card .select {
		flex: 1;
		display: flex;
		justify-content: space-between;
		border-color: var(--blue);
		box-shadow: 0 0 0 2px rgba(17, 122, 187, .18);
	}
	.card .select::after { content: "\25BE"; margin-left: 6px; color: #50575e; }
	.card .money { width: 74px; }
	.card code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
	.card .status {
		display: flex;
		align-items: center;
		gap: 8px;
		margin-top: 13px;
		padding: 8px 10px;
		font-size: 11.5px;
		line-height: 1.35;
		background: #edfaef;
		border-left: 4px solid var(--green);
		border-radius: 3px;
	}
	.card .status b { color: var(--green); font-size: 15px; }
</style>
</head>
<body>
	<div class="field"></div>
	<div class="copy">
		<div class="brand"><img src="icon-256x256.png" alt=""><span>GAinWP</span></div>
		<h1>Google Analytics 4 that tracks<br>results, not just traffic</h1>
		<div class="tags">
			<span>Form leads</span>
			<span>Goal values</span>
			<span>Consent Mode v2</span>
		</div>
	</div>
	<div class="card">
		<label>Contact us <small>Gravity Forms</small></label>
		<div class="row"><div class="select">Lead (generate_lead)</div><div class="money">$100</div></div>
		<div class="status"><b>&#10003;</b><span>Sent to GA4: <code>generate_lead</code>, $100</span></div>
	</div>
</body>
</html>
